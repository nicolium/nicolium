name: Nicolium CI

on:
  push:
    branches: [ "develop", "semistable" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: docker
    name: Check if the code builds and is formatted correctly
    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11

    - name: Use Node.js 22
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install deps
      working-directory: .
      run: pnpm install --ignore-scripts

    - name: Build pl-api
      env:
        NODE_ENV: production
      working-directory: ./packages/pl-api
      run: pnpm build

    - name: Lint
      working-directory: ./packages/nicolium
      run: pnpm lint

    - name: Check formatting
      working-directory: ./packages/nicolium
      run: pnpm fmt:check

    - name: Typecheck
      working-directory: ./packages/nicolium
      run: pnpm typecheck

    - name: Build
      env:
        NODE_ENV: production
      working-directory: ./packages/nicolium
      run: pnpm build

    - name: i18n
      working-directory: ./packages/nicolium
      run: |
          pnpm i18n
          git diff
          git diff --quiet || (echo "Locale files are out of date. Please run \`pnpm i18n\`" && exit 1)
